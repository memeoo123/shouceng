  <title>这座城我守定了 - offline meta restoration</title>

    @font-face {
      font-family: "OPPOSansH";
      src: url("res/OPPOSansH.ttf") format("truetype");
      font-display: swap;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #12151f;

    }
    canvas { image-rendering: auto; }

<body>
  <script>
    window.__RESTORE_RUNTIME_ERRORS__ = [];
    window.addEventListener("error", (event) => window.__RESTORE_RUNTIME_ERRORS__.push(String(event.error && event.error.stack || event.message || event.error)));
    window.addEventListener("unhandledrejection", (event) => window.__RESTORE_RUNTIME_ERRORS__.push(String(event.reason && event.reason.stack || event.reason)));
  </script>
